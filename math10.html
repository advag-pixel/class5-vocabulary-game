<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>מתמטיקה כיתה י – מתכוננים למבחן</title>
<style>
:root{--bg:#eef4ff;--card:#fff;--ink:#1f2a44;--pri:#3b6cf6;--ok:#22a559;--bad:#e5484d;--warn:#f5a524;--mut:#6b7794}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:22px;margin:6px 0;text-align:center}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 4px 16px rgba(30,50,110,.10);margin-bottom:12px}
.hide{display:none!important}
input.nick{width:100%;font-size:20px;padding:12px;border:2px solid #c9d5f5;border-radius:12px;text-align:center}
input.nick.err{border-color:var(--bad)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:20px;font-weight:700;background:var(--pri);color:#fff;cursor:pointer}
.btn.sec{background:#e3eaff;color:var(--pri)}
.btn:active{transform:scale(.98)}
.bar{height:14px;border-radius:9px;background:#e3eaff;overflow:hidden}
.bar>b{display:block;height:100%;background:linear-gradient(90deg,#3b6cf6,#22a559);border-radius:9px;transition:width .5s}
.big{font-size:44px;font-weight:800;text-align:center;color:var(--pri)}
.sub{color:var(--mut);text-align:center;font-size:14px}
.grp{font-weight:700;margin:12px 0 6px;color:var(--pri)}
.tp{display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;background:#f5f8ff;margin-bottom:6px;cursor:pointer}
.tp .bar{flex:1;height:10px}
.tp span.n{flex:0 0 130px;font-size:15px}
.tp span.p{flex:0 0 38px;font-size:13px;color:var(--mut);text-align:left}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.top .bar{flex:1}
.mini{font-size:14px;font-weight:700;color:var(--mut)}
.ibtn{border:0;background:#e3eaff;border-radius:10px;font-size:18px;padding:6px 10px;cursor:pointer}
.tch{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.face{font-size:44px;width:64px;height:64px;border-radius:50%;background:#fff3d6;display:flex;align-items:center;justify-content:center;flex:0 0 64px}
.face.hop{animation:hop .5s}
.face.shake{animation:shake .4s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-6deg)}70%{transform:translateY(-4px) rotate(6deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.bub{background:#fff3d6;border-radius:14px;padding:8px 12px;font-size:16px;flex:1;min-height:42px;display:flex;align-items:center}
.q{font-size:21px;font-weight:700;line-height:1.6;text-align:center;margin:6px 0}
.vis{text-align:center;margin:6px 0}
.vis svg{max-width:100%;height:auto}
pre.vert{direction:ltr;display:inline-block;text-align:right;font:700 26px/1.25 "Courier New",monospace;background:#f5f8ff;border-radius:12px;padding:10px 18px;margin:6px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{border:2px solid #c9d5f5;background:#fff;border-radius:14px;padding:14px 6px;font-size:21px;font-weight:700;color:var(--ink);cursor:pointer;min-height:58px}
.opt.ok{background:#d9f5e3;border-color:var(--ok);color:#0e6b33}
.opt.bad{background:#ffe0e1;border-color:var(--bad);color:#a3191e}
.opt.dim{opacity:.55}
.hint,.expl{margin-top:10px;border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.6}
.hint{background:#fff3d6}.expl{background:#e8f0ff}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.15;font-weight:800}
.fr i{font-style:normal;padding:0 5px}.fr i:first-child{border-bottom:2px solid currentColor}
.mx{font-size:1.3em;margin-inline:2px;font-weight:800}
.lt{direction:ltr;display:inline-block}
.res li{margin:4px 0}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:#fff;border:3px solid var(--warn);border-radius:18px;padding:12px 22px;font-size:22px;font-weight:800;z-index:9;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:pop 1.6s forwards}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.5)}15%{opacity:1;transform:translateX(-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-30px)}}
.warn{background:#fff3d6;border-radius:10px;padding:8px;font-size:13px;margin-top:8px}
.padv{direction:ltr;text-align:center;font:800 32px "Courier New",monospace;min-height:48px;border:3px solid var(--pri);border-radius:12px;background:#fff;margin:6px 0;padding:4px}
.pad{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pk{font-size:26px;font-weight:800;padding:12px 0;border:2px solid #c9d5f5;background:#fff;border-radius:12px;cursor:pointer}.pk.go{grid-column:span 2;background:var(--ok);color:#fff;border-color:var(--ok)}.pk:active{background:#e3eaff}
#cv{width:100%;max-width:320px;height:auto;border:2px dashed #c9d5f5;border-radius:12px;background:#fffef6;touch-action:none;display:block;margin:6px auto}
</style>
</head>
<body>
<div class="wrap">
<h1>🧮 מתמטיקה כיתה י – מתכוננים למבחן</h1>

<div id="sStart">
 <div class="card">
  <div class="tch"><div class="face">👩‍🏫</div><div class="bub">היי! אני המורה. כתבו כינוי ובואו נתאמן במשוואות, אחוזים וסטטיסטיקה – כל שלב מוסבר 💪</div></div>
  <input id="nick" class="nick" maxlength="14" placeholder="כינוי (חובה)" autocomplete="off">
  <div style="height:10px"></div>
  <div class="big" id="pctBig">0%</div>
  <div class="sub">מוכנות למבחן</div>
  <div class="bar" style="margin:8px 0"><b id="pctBar" style="width:0"></b></div>
  <div class="sub" id="eta"></div>
  <div style="height:10px"></div>
  <button class="btn" id="goMix">▶ משחק מעורב (14 שאלות)</button>
  <div id="storeWarn" class="warn hide">⚠️ הדפדפן לא שומר התקדמות (מצב גלישה פרטי?). פתחו בדפדפן רגיל כדי שההתקדמות תישמר.</div>
 </div>
 <div class="card"><div class="sub" style="margin-bottom:6px">או תרגול נושא ספציפי – לחצו על נושא:</div><div id="topics"></div>
  <button class="btn sec" id="resetBtn" style="margin-top:10px;font-size:14px;padding:8px">איפוס התקדמות</button></div>
</div>

<div id="sGame" class="hide">
 <div class="top"><span class="mini" id="qn"></span><div class="bar"><b id="rbar" style="width:0"></b></div><span class="mini" id="pctSm"></span><button class="ibtn" id="mute">🔊</button><button class="ibtn" id="skip" title="דלג">⏭ דלג</button><button class="ibtn" id="quit">✖</button></div>
 <div class="card">
  <div class="tch"><div class="face" id="face">👩‍🏫</div><div class="bub" id="bub"></div></div>
  <div class="q" id="qt"></div>
  <div class="vis" id="qv"></div>
  <div class="opts" id="opts"></div>
  <div id="pad" class="hide"><div class="padv" id="padv"></div><div class="pad"></div></div>
  <div style="margin-top:10px;display:flex;gap:8px"><button class="btn sec" id="hBtn" style="font-size:15px;padding:8px">💡 עזרה</button><button class="btn sec" id="dBtn" style="font-size:15px;padding:8px">✏️ טיוטה</button></div>
  <div id="draft" class="hide"><canvas id="cv" width="320" height="180"></canvas><button class="btn sec" id="dClr" style="font-size:14px;padding:6px">🧽 נקה</button></div>

  <div class="hint hide" id="hint"></div>
  <div class="expl hide" id="expl"></div>
  <button class="btn hide" id="next" style="margin-top:12px">המשך ←</button>
 </div>
</div>

<div id="sRes" class="hide">
 <div class="card res">
  <div class="tch"><div class="face hop">🎉</div><div class="bub" id="resMsg"></div></div>
  <div class="big" id="resScore"></div>
  <div class="sub" id="resSub"></div>
  <div class="bar" style="margin:10px 0"><b id="resBar" style="width:0"></b></div>
  <div id="resList"></div>
  <div style="height:10px"></div>
  <button class="btn" id="again">שחקו שוב</button>
  <div style="height:8px"></div>
  <button class="btn sec" id="home">לתפריט</button>
 </div>
</div>
</div>
<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const LT=s=>`<span class="lt">${s}</span>`;
const M=n=>String(n).replace('-','−');
const rd=x=>Math.round(x*100)/100;
const G={};
// ----- equation helpers -----
const cf=c=>c===1?'':c===-1?'−':M(c);
function side(co,k){let s='';if(co)s+=cf(co)+'x';if(k!==0)s+=s?(k>0?' + '+k:' − '+(-k)):M(k);return s||'0';}
const eqS=(l,r)=>LT(`${l} = ${r}`);
function mk(t,vis,st,sum,lines){return {t,st,sum,show:(i,ans)=>`<div class="q" style="margin:4px 0">${vis}</div>`+
  (lines?lines.slice(0,ans.length).map(l=>`<div class="q" style="margin:2px 0;color:var(--ok)">${l}</div>`).join(''):
   ans.map((a,j)=>`<div class="sub" style="font-size:16px">✔ ${st[j].p.replace(/\?.*$/,'').trim()} ${M(a)}</div>`).join(''))};}
function solX(){let x;do{x=R(-9,12);}while(x===0);return x;}
function nz(a,b){let v;do{v=R(a,b);}while(v===0);return v;}
const sub=(n)=>n>=0?`מחסרים ${n}`:`מוסיפים ${-n}`;
const II={};
II.eq1=()=>{const a=R(2,9),x=solX(),b=nz(-12,12),c=a*x+b;
  return mk('פתרו את המשוואה – שלב אחר שלב:',eqS(side(a,b),c),[
   {raw:1,p:`${b>0?'מחסרים':'מוסיפים'} ${Math.abs(b)} בשני האגפים: ${LT(a+'x = ?')}`,a:c-b,h:`כדי להעלים את ${M(b)} ${sub(b).replace('מחסרים','מחסירים')} משני האגפים.`,e:`${c} ${b>0?'−':'+'} ${Math.abs(b)} = ${c-b}.`},
   {raw:1,p:`מחלקים ב־${a}: ${LT('x = ?')}`,a:x,h:`מחלקים את שני האגפים ב־${a}: ${M(c-b)} ÷ ${a}.`,e:`${M(c-b)} ÷ ${a} = ${M(x)}.`}],
   `x = ${M(x)}`,[eqS(a+'x',M(c-b)),eqS('x',M(x))]);};
II.eq2=()=>{const a=R(3,9),c=R(1,a-1),x=solX(),b=nz(-9,9),d=(a-c)*x+b;
  return mk('פתרו את המשוואה – שלב אחר שלב:',eqS(side(a,b),side(c,d)),[
   {raw:1,p:`מעבירים את ${c}x לאגף שמאל: ${LT('?x')} (כמה x נשארו?)`,a:a-c,h:`${a}x − ${c}x. מחסרים בשני האגפים.`,e:`${a} − ${c} = ${a-c}.`},
   {raw:1,p:`מעבירים את ${M(b)} לאגף ימין: ${LT((a-c)+'x = ?')}`,a:d-b,h:`${b>0?'מחסרים':'מוסיפים'} ${Math.abs(b)} בשני האגפים: ${M(d)} ${b>0?'−':'+'} ${Math.abs(b)}.`,e:`${M(d)} ${b>0?'−':'+'} ${Math.abs(b)} = ${M(d-b)}.`},
   {raw:1,p:`מחלקים ב־${a-c}: ${LT('x = ?')}`,a:x,h:`${M(d-b)} ÷ ${a-c}.`,e:`${M(d-b)} ÷ ${a-c} = ${M(x)}.`}],
   `x = ${M(x)}`,[eqS((a-c)+'x '+(b>0?'+ '+b:'− '+(-b)),M(d)),eqS((a-c)+'x',M(d-b)),eqS('x',M(x))]);};
const par=(a,b)=>`${a}(x ${b>0?'+':'−'} ${Math.abs(b)})`;
II.eqp1=()=>{const a=R(2,6);let x,b;do{x=solX();b=nz(-8,8);}while(x+b===0);const c=a*(x+b);
  return mk('משוואה עם סוגריים – שלב אחר שלב:',eqS(par(a,b),M(c)),[
   {raw:1,p:`פותחים סוגריים: ${LT(a+'x '+(b>0?'+':'−')+' ? = '+M(c))}`,a:Math.abs(a*b),h:`כופלים את ${a} בכל מה שבתוך הסוגריים: ${a} × ${M(b)}. כאן שואלים על הערך המוחלט (בלי הסימן).`,e:`${a} × ${M(b)} = ${M(a*b)}.`},
   {raw:1,p:`${b>0?'מחסרים':'מוסיפים'} ${Math.abs(a*b)}: ${LT(a+'x = ?')}`,a:c-a*b,h:`מעבירים את החלק החופשי לאגף ימין: ${M(c)} ${b>0?'−':'+'} ${Math.abs(a*b)}.`,e:`${M(c)} ${b>0?'−':'+'} ${Math.abs(a*b)} = ${M(c-a*b)}.`},
   {raw:1,p:`מחלקים ב־${a}: ${LT('x = ?')}`,a:x,h:`${M(c-a*b)} ÷ ${a}.`,e:`${M(c-a*b)} ÷ ${a} = ${M(x)}.`}],
   `x = ${M(x)}`,[eqS(a+'x '+(b>0?'+ ':'− ')+Math.abs(a*b),M(c)),eqS(a+'x',M(c-a*b)),eqS('x',M(x))]);};
II.eqp2=()=>{const a=R(3,6),c=R(1,a-1);let x,b;do{x=solX();b=nz(-6,6);}while(false);const d=(a-c)*x+a*b;
  return mk('משוואה עם סוגריים בשני האגפים – שלב אחר שלב:',eqS(par(a,b),side(c,d)),[
   {raw:1,p:`פותחים סוגריים: ${LT(a+'x '+(b>0?'+':'−')+' ? = '+side(c,d))}`,a:Math.abs(a*b),h:`${a} × ${M(b)}. כאן שואלים על הערך המוחלט (בלי הסימן).`,e:`${a} × ${M(b)} = ${M(a*b)}.`},
   {raw:1,p:`מעבירים את ${c}x לאגף שמאל: ${LT('?x')}`,a:a-c,h:`${a}x − ${c}x.`,e:`${a} − ${c} = ${a-c}.`},
   {raw:1,p:`מעבירים את החלק החופשי לימין: ${LT((a-c)+'x = ?')}`,a:d-a*b,h:`${b>0?'מחסרים':'מוסיפים'} ${Math.abs(a*b)}: ${M(d)} ${b>0?'−':'+'} ${Math.abs(a*b)}.`,e:`${M(d)} ${b>0?'−':'+'} ${Math.abs(a*b)} = ${M(d-a*b)}.`},
   {raw:1,p:`מחלקים ב־${a-c}: ${LT('x = ?')}`,a:x,h:`${M(d-a*b)} ÷ ${a-c}.`,e:`${M(d-a*b)} ÷ ${a-c} = ${M(x)}.`}],
   `x = ${M(x)}`,[eqS(a+'x '+(b>0?'+ ':'− ')+Math.abs(a*b),side(c,d)),eqS((a-c)+'x '+(b>0?'+ ':'− ')+Math.abs(a*b),M(d)),eqS((a-c)+'x',M(d-a*b)),eqS('x',M(x))]);};
// ----- percent -----
II.pct1=()=>{const N=pick([80,120,150,200,240,300,360,450,500,600]),p=pick([5,10,15,20,25,30,40,60,75]),one=rd(N/100),r=rd(N*p/100);
  return mk('אחוז ממספר – שלב אחר שלב:',`כמה הם ${p}% מ־${N}?`,[
   {p:`1% מ־${N} = ${N} ÷ 100 = ?`,a:one,h:'1% הוא מאית: מחלקים ב־100 (מזיזים את הנקודה שתי ספרות שמאלה).',e:`${N} ÷ 100 = ${one}.`},
   {p:`${p} × ${one} = ?`,a:r,h:`${p}% הם ${p} פעמים 1%.`,e:`${p} × ${one} = ${r}.`}],`${p}% מ־${N} = ${r}`);};
II.pct2=()=>{const price=R(2,40)*20,p=pick([10,20,25,30,40,50]),dis=Math.random()<.5,amt=price*p/100,fin=dis?price-amt:price+amt;
  return mk(dis?'הנחה באחוזים – שלב אחר שלב:':'תוספת באחוזים – שלב אחר שלב:',dis?`מחיר מוצר ${price} ₪. ניתנה הנחה של ${p}%. מה המחיר אחרי ההנחה?`:`מחיר מוצר ${price} ₪. המחיר עלה ב־${p}%. מה המחיר החדש?`,[
   {p:`${p}% מ־${price} = ? (בשקלים)`,a:amt,h:`${price} ÷ 100 × ${p}.`,e:`${price} ÷ 100 = ${rd(price/100)}; × ${p} = ${amt}.`},
   {p:`${price} ${dis?'−':'+'} ${amt} = ?`,a:fin,h:dis?'מחסירים את ההנחה מהמחיר המקורי.':'מוסיפים את התוספת למחיר המקורי.',e:`${price} ${dis?'−':'+'} ${amt} = ${fin}.`}],`המחיר: ${fin} ₪`);};
II.pct3=()=>{const b=pick([4,5,10,20,25,50]),a=R(1,b-1),k=100/b;
  return mk('כמה אחוז? – שלב אחר שלב:',`התלמיד קיבל ${a} נקודות מתוך ${b}. כמה אחוז זה?`,[
   {p:`100 ÷ ${b} = ? (כמה אחוזים שווה נקודה אחת)`,a:k,h:`כל ${b} הנקודות הן 100%. מחלקים 100 ב־${b}.`,e:`100 ÷ ${b} = ${k}.`},
   {p:`${a} × ${k} = ? (באחוזים)`,a:a*k,h:`${a} נקודות כפול האחוזים של נקודה אחת.`,e:`${a} × ${k} = ${a*k}%.`}],`${a} מתוך ${b} = ${a*k}%`);};
II.pct4=()=>{const p=pick([10,20,25,30,40,50]),X=R(2,30)*20,Y=X*p/100,one=rd(Y/p);
  return mk('מציאת השלם – שלב אחר שלב:',`${p}% ממספר הם ${Y}. מהו המספר?`,[
   {p:`1% = ${Y} ÷ ${p} = ?`,a:one,h:`אם ${p}% הם ${Y}, אז 1% הוא ${Y} ÷ ${p}.`,e:`${Y} ÷ ${p} = ${one}.`},
   {p:`100% = ${one} × 100 = ?`,a:X,h:'המספר השלם הוא 100% – מכפילים את ה־1% ב־100.',e:`${one} × 100 = ${X}.`}],`המספר הוא ${X}`);};
// ----- statistics -----
function tbl(vals,fs,l1,l2){const c='style="border:2px solid #c9d5f5;padding:6px 12px;text-align:center"';
  return `<table style="margin:6px auto;border-collapse:collapse;font-size:20px;font-weight:700"><tr><td ${c}>${l1}</td>${vals.map(v=>`<td ${c}>${v}</td>`).join('')}</tr><tr><td ${c}>${l2}</td>${fs.map(v=>`<td ${c}>${v}</td>`).join('')}</tr></table>`;}
function freqs(k,n){for(let t=0;t<500;t++){const f=Array.from({length:k},(_,i)=>i+1);let r=n-k*(k+1)/2;if(r<0)break;while(r-->0)f[R(0,k-1)]++;if(new Set(f).size===k)return sh(f);}const f=Array.from({length:k},(_,i)=>i+1);f[k-1]+=n-k*(k+1)/2;return sh(f);}
II.tab1=()=>{const n=pick([10,20,25,50]),k=n===10?4:R(4,5),v0=R(0,4),vals=Array.from({length:k},(_,i)=>v0+i),f=freqs(k,n),i=R(0,k-1);
  return mk('טבלת שכיחות – שלב אחר שלב:',tbl(vals,f,'ערך','שכיחות'),[
   {p:`כמה נתונים יש בסך הכול? (סוכמים את השכיחויות) = ?`,a:n,h:'מחברים את כל המספרים בשורת השכיחות.',e:f.join(' + ')+` = ${n}.`},
   {p:`איזה אחוז מהנתונים הם הערך ${vals[i]}? ${f[i]} ÷ ${n} × 100 = ?`,a:f[i]*100/n,h:`מחלקים את השכיחות (${f[i]}) בסך הנתונים (${n}) ומכפילים ב־100.`,e:`${f[i]} ÷ ${n} = ${rd(f[i]/n)}; × 100 = ${f[i]*100/n}%.`}],`שכיחות יחסית: ${f[i]*100/n}%`);};
II.mode=()=>{

  $('pad').querySelectorAll('.pk').forEach(b=>b.onclick=()=>padKey(b.dataset.k));
  document.addEventListener('keydown',e=>{if($('pad').classList.contains('hide'))return;
    if(/^[0-9.]$/.test(e.key))padKey(e.key);else if(e.key==='-')padKey('−');else if(e.key==='Backspace')padKey('⌫');else if(e.key==='Enter'){e.stopPropagation();padKey('✓');}},true);
  // draft canvas
  const cv=$('cv'),x=cv.getContext('2d');let dr=false;x.lineWidth=3;x.lineCap='round';x.strokeStyle='#1f2a44';
  const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
  cv.onpointerdown=e=>{dr=true;const p=pos(e);x.beginPath();x.moveTo(p[0],p[1]);cv.setPointerCapture(e.pointerId);};
  cv.onpointermove=e=>{if(!dr)return;const p=pos(e);x.lineTo(p[0],p[1]);x.stroke();};
  cv.onpointerup=cv.onpointercancel=()=>{dr=false;};
  $('dBtn').onclick=()=>$('draft').classList.toggle('hide');
  $('dClr').onclick=()=>x.clearRect(0,0,cv.width,cv.height);
})();
$('hBtn').onclick=()=>{
  if(ST&&!ST.done){const s=ST.g.st[ST.i];ST.mist++;ST.smist++;
    if(ST.smist===1){say('הנה עזרה 💡','hop');$('hint').innerHTML='💡 רמז: '+s.h;$('hint').classList.remove('hide');}
    else{say('הנה הפתרון – ממשיכים 📘');$('expl').innerHTML='📘 '+s.e;$('expl').classList.remove('hide');ST.ans.push(s.a);ST.smist=0;$('hint').classList.add('hide');ST.i++;
      if(ST.i>=ST.g.st.length)return endInter();renderInter();}
    return;}
  if(!cur||locked||!$('sGame')||ST)return;
  if(mist===0){mist=1;streak=0;say('הנה עזרה 💡');$('hint').innerHTML='💡 רמז: '+cur.h;$('hint').classList.remove('hide');}
  else{mist=2;locked=true;streak=0;$('opts').children[cur.a].classList.add('ok');say('הנה הפתרון – נלמד ונמשיך 📘');
    $('expl').innerHTML='📘 הסבר: '+cur.e;$('expl').classList.remove('hide');$('next').classList.remove('hide');}
};
$('skip').onclick=()=>{$('pad').classList.add('hide');$('hint').classList.add('hide');
  const answered=ST?ST.done:locked;
  if(answered){advance();return;}
  streak=0;if(ST)ST.done=true;rq.splice(qi,1);
  if(!rq.length){renderStart();show('sStart');return;}
  nextQ();};
renderStart();
</script>
